project_type: web_service_rag_mcp_demo
goal: >-
  건강기능식품 법령·기능성 정보를 조회하는 로컬 포트폴리오 데모용 RAG·MCP 서비스를 구축한다.
  핵심 법령은 조문 단위 RAG로 처리하고, 식약처 기능성 정보는 구조화 조회로 처리한다.
  FastMCP 도구와 최소 기능 웹 챗봇을 통해 정보를 제공하고, 법령 출처와 RAG 평가 지표까지 확인할 수 있게 한다.

constraints:
  - 모든 UI 문구, README, 문서, CLI 안내는 한국어로 작성한다.
  - 이번 스코프는 로컬 Docker Compose 포트폴리오 데모까지만 목표로 하고 실제 클라우드 배포는 고려하지 않는다.
  - 법령 데이터만 RAG 대상으로 하고, 식약처 기능성 정보는 구조화 조회만 지원한다.
  - 법령 조문은 하나의 조문을 하나의 청크로 저장한다.
  - 식약처 데이터는 CSV 사전 적재 후 total_count 기반 증분 감지 전략으로 통일한다.
  - 임베딩 모델은 Ollama + qwen3-embedding:0.6b로 고정한다.
  - MCP 서버 인증은 토큰 기반 간단 인증으로 제한한다.
  - 기본 로그인은 JWT 방식으로 구현하고, 소셜 로그인은 제외한다.
  - 법령 참조 확장 결과는 각주 출처 표기로 MVP를 시작하고, 명확한 3단 구분은 이후 품질 개선 후보로 유지한다.
  - QMD는 초기 설계에 최소 연동만 포함한다.
  - Graphify는 코드베이스 온보딩 전용으로만 사용하고, 법령/기능성 도메인 그래프에는 사용하지 않는다.
  - Neo4j 같은 별도 그래프 DB는 도입하지 않고 PostgreSQL + pgvector로 처리한다.
  - LLM API 키는 .env 파일 직접 편집 안내를 기본으로 하고 bash/zsh 명령어 예시도 함께 제공한다.

decisions:
  - FE 프레임워크는 구현 편의성과 포트폴리오 데모 관점에서 Next.js로 확정한다.
  - 백엔드는 NestJS, RAG/FastMCP는 Python 서비스로 구성한다.
  - 법령 참조 결과의 명확한 3단 구분은 우선 하지 않고 각주 출처 표기로 MVP를 시작한다.
  - LangGraph 노드 설계는 6단계 구조로 확정한다.
  - MCP 서버 인증은 토큰 기반 간단 인증으로 확정한다.
  - 기본 로그인 인증은 JWT 방식으로 확정한다.
  - QMD는 초기 설계에 최소 연동을 포함한다.
  - 건강기능식품의 표시기준 law_type은 administrative_rule로 확정한다.
  - RAG 평가는 Recall@k, MRR 등 정량 지표까지 포함하고 데모 응답에 표시한다.
  - 식약처 데이터는 I-0050, I-0040, I0030, C003 및 고시기능성 API를 대상으로 하고, 고시형/개별인정형 모두 처리한다.
  - 법령 참조 확장 조회의 3단 출처 구분은 추후 개선 후보로 프로젝트 내부 문서에 기록한다.

acceptance_criteria:
  - Docker Compose로 PostgreSQL+pgvector, NestJS 백엔드, Next.js 프론트엔드, FastMCP 서비스가 함께 실행된다.
  - 법령 데이터는 국가법령정보센터에서 조문 단위로 수집해 legal_provisions에 저장하고, 참조 관계는 provision_references에 위임/인용 엣지로 저장한다.
  - 건강기능식품의 표시기준은 law_type=administrative_rule로 구분 저장한다.
  - 법령 RAG는 조문 1개=청크 1개로 임베딩하고, qwen3-embedding:0.6b 임베딩으로 벡터 검색을 수행한다.
  - 식약처 기능성 정보는 I-0050, I-0040, I0030, C003 및 고시기능성 API를 구조화 조회만으로 처리하고, 고시형/개별인정형 모두 조회 가능하다.
  - 식약처 데이터는 CSV 사전 적재 후 total_count 기반 증분 감지 전략으로 갱신한다.
  - LangGraph 파이프라인은 질문 이해/의도 분류 → 도구 선택/라우팅 → 법령 RAG 검색 → 기능성 구조화 조회 → 결과 합성 → 출처 표기 및 응답의 6단계 노드로 구성한다.
  - FastMCP는 법령 검색, 기능성 원료 조회, 품목제조신고 조회, 고시기능성 조회 도구를 노출하고, 토큰 기반 간단 인증을 적용하며 README에 토큰 생성/사용 방법을 안내한다.
  - 웹 데모는 기본 로그인을 JWT 방식으로 제공하고, 고객:성분 1:N 시딩 데이터와 함께 최소 기능 챗봇을 제공한다.
  - 법령 응답에는 각 조문 출처(법률/시행령/시행규칙/행정규칙)를 각주 형태로 표기하고, 추후 3단 출처 구분 도입 가능성을 프로젝트 내부 문서에 기록한다.
  - RAG 평가에 Recall@k와 MRR 등 정량 지표를 포함하고, 데모 사용자가 응답에서 평가 지표를 확인할 수 있게 한다.
  - Obsidian Vault 운영 방식과 QMD 최소 연동 설계를 문서에 포함한다.
  - README가 한국어로 Docker Compose 실행, Ollama 모델 준비, .env LLM API 키 입력(bash/zsh 명령 포함), MCP 토큰 발급/사용 방법, 데모 사용법을 안내한다.

non_goals:
  - 실제 클라우드 배포 및 운영 인프라 구축
  - 소셜 로그인 및 외부 계정 연동
  - 법령 외 데이터의 RAG 확장
  - Neo4j 같은 별도 그래프 DB 도입
  - Graphify를 법령/기능성 도메인 지식 그래프에 사용
  - 실제 제품 수준의 보안/운영 고도화
  - QMD 고급 검색 및 성능 최적화
